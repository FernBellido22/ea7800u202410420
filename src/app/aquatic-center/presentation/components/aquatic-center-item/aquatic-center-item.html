
<mat-card class="center-card">
  <mat-card-header>
    <mat-card-title>{{ center.name }}</mat-card-title>
    <mat-card-subtitle>
      {{ center.activityType }}
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>
      <strong>Capacity:</strong>
      {{ center.capacity }} participants
    </p>

    <p>
      <strong>Latitude:</strong>
      {{ center.latitude }}
    </p>

    <p>
      <strong>Longitude:</strong>
      {{ center.longitude }}
    </p>
  </mat-card-content>
</mat-card>
