
<mat-card class="weather-card">
  <mat-card-header>
    <mat-card-title>Current Weather</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (loading) {
      <p role="status">Loading weather information...</p>
    } @else if (error) {
      <p class="weather-error" role="alert">
        {{ error }}
      </p>
    } @else if (weather) {
      <p class="temperature">
        {{ weather.temperature }} °C
      </p>
      <p>Current temperature at the aquatic center.</p>
    } @else {
      <p>Weather information is not available yet.</p>
    }
  </mat-card-content>
</mat-card>
